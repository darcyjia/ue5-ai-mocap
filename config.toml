# aimocap 配置。路径用正斜杠。

[paths]
# 本机路径不写在这里，放在 config.local.toml（不进仓库）。新电脑运行：
#     python -m aimocap setup --project <你的.uproject> --write
# 自动探测 Blender、ffmpeg、Python、UE、WSL 里的 GVHMR 等，再用 python -m aimocap doctor 检查。
# 各项含义：work_root 素材工作目录 / render_root UE 渲染输出 / python 带 numpy scipy matplotlib 的系统 Python /
# blender / ffmpeg / dreamina 即梦命令行 / ue_cmd UnrealEditor-Cmd.exe / ue_project 默认工程 /
# wsl_distro 装 GVHMR 的 WSL 发行版 / gvhmr_dir WSL 里的 GVHMR 目录（如 ~/mocap/GVHMR）

[generate]
model = "seedance2.5"
resolution = "480p"      # 做动捕源 480p 就够；1080p 实测没有改善脚滑/抖动
duration = 15
max_credits = 1200       # 单次生成的预估积分超过这个数就拒绝执行
retries = 0              # 生成失败后自动重试次数（失败任务可能也会扣费）

[solve]
num_people = 2
f_mm = 0                 # 等效焦距(mm)，0 = GVHMR 默认估计

[clean]
contact_on = 0.6         # 着地置信度滞回阈值
contact_off = 0.4
foot_max_height = 0.10   # 脚掌关节离地超过这个高度(m)不算着地
min_segment = 3          # 着地片段最短帧数
merge_gap = 4            # 两段着地之间的空档 ≤ 这么多帧……
merge_max_lift = 0.12    # ……且空档里脚没有抬高超过这个高度(m)，就合并成一段
ik_ramp = 3              # IK 在着地段首尾的渐变帧数
kin_contact = true       # 运动学备用着地判据（GVHMR 着地概率失准时兜底）：
kin_height = 0.03        # 脚掌离静止脚底高度 < 这个值(m)……
kin_speed = 0.35         # ……且水平速度 < 这个值(m/s) 就算着地

[hands]
# 手型状态：MediaPipe 识别四指弯曲角 → 拳 / 半握 / 掌，套预设到手指关节。追求感觉，不追求逐指还原。
enabled = true           # false：手保持平伸（和 v0.1 一样）
python = ".venv-tools/Scripts/python.exe"      # 装了 mediapipe + opencv 的独立环境（相对仓库根）
model = "models/hand_landmarker.task"
fist = 110               # 四指弯曲角 ≥ 这个值为拳
palm = 55                # < 这个值为掌，中间为半握
gap_fill = 8             # 识别不到的缺口 ≤ 这么多帧：沿用前后的手型
fallback = "guard"       # 长缺口：出拳动作（手臂伸直+快）判为拳，其余用这个
punch_elbow = 150        # 出拳判定：肘角(°) 大于这个……
punch_speed = 2.5        # ……且手腕速度(m/s) 大于这个
vote = 7                 # 多帧投票窗口
min_segment = 5          # 手型片段最短帧数
blend = 5                # 手型切换的过渡帧数

[impact]
# 受力反馈：GVHMR 会把受击时短促的晃动压小，这里补回来。
enabled = true
hf_gain = "auto"         # 躯干/脖子/头 快速变化部分的放大倍数；auto = 按视频校准（视频/动捕 的头部高频比）
hf_gain_max = 2.5
hf_sigma = 3             # 区分"快/慢"的平滑宽度（帧）
stop_frames = 6          # 打击判定：速度峰值后这么多帧内……
stop_ratio = 0.45        # ……降到峰值的这个比例以下（打中/被挡），挥空穿过去的不算
contact_dist = 0.15      # 且打击点离对方部位表面 < 这个距离(m)（双人相对位置有几厘米误差，放宽些）
merge_frames = 3         # 同一人这么多帧内的多次打击只算最快的一下
ref_speed = 3.0          # 幅度按 来拳速度/ref_speed 缩放（0.5–1.6 倍）
tau = 0.06               # 冲击到峰值的时间(s)，越小越"脆"
duration = 0.3           # 冲击持续(s)

[impact.min_speed]       # 各打击点的最低速度 m/s（GVHMR 会把快拳压慢，实测连环冲拳只有 2–3 m/s）
fist = 1.8
elbow = 2.0
foot = 3.0
knee = 2.0

[impact.amp_deg]         # 各受击部位的基准幅度（度）
head = 7.0
chest = 4.0
belly = 4.0
arm = 10.0

[face]
# 表情：不还原视频里的脸，由动作驱动（眼神盯对手、眨眼、受击表情），写进 MetaHuman 面部控制板。
enabled = true
style_strength = 1.0     # 性格底色强度（[[person]] 的 face_style：calm 冷静 / fierce 狰狞）
hit_strength = 1.0       # 受击表情强度（跟 impact 的冲击幅度走，格挡时再减弱）
hit_tau = 0.05           # 受击表情到峰值的时间(s)
hit_duration = 0.45      # 受击表情持续(s)
eye_max_yaw = 35.0       # 眼球左右最大转角(°)，超出时眼球顶到边
eye_max_pitch = 25.0
gaze_x_sign = 1.0        # 眼球方向和控制板的正负对应；在 UE 里看到眼睛往反方向看就改成 -1
gaze_y_sign = 1.0
gaze_gain = [0.5, 0.7]   # 眼球只转"应转角度"的这个比例（左右, 上下）：双人相对纵深估不准，完全对准会过度转眼
gaze_limit = 0.6         # 眼球控件最大值（1 = 转到头；太大会长时间斜眼）
saccade_interval = [0.4, 1.5]   # 扫视：每隔这么久(s)眼神轻微跳一下
saccade_amp = 0.06

[face.blink_interval]    # 眨眼间隔(s)，按性格
calm = [1.5, 4.0]
fierce = [2.5, 5.0]

[preview]
enabled = true

[ue]
content_root = "/Game/AIMocap"                # 每条素材的资产放在 content_root/<素材名>
retarget_dir = "/Game/AIMocap/_Retarget"      # 各 MetaHuman 角色共用的 IK Rig
uniform_horizontal_scale = true               # 两人用统一的水平缩放，使步幅匹配目标角色腿长
force_horizontal_scale = 0                    # >0 时强制使用这个水平缩放（调试/特殊需要）

# 画面从左到右依次对应 person[0]、person[1] ……
# mh_bp：MetaHuman 蓝图（完整角色，带头/衣服/头发）；没有 mh_bp 时退回到只用 mh_mesh 身体网格。
# 单段素材可在 <素材>/input/persons.json 里覆盖（编辑器插件的表单会写这个文件）。
[[person]]
name = "left"
mh_bp = "/Game/MetaHumans/NewMetaHumanCharacter/BP_NewMetaHumanCharacter"
face_style = "calm"      # 表情性格：calm 冷静（主角）/ fierce 狰狞（反派）

[[person]]
name = "right"
mh_bp = "/Game/MetaHumans/NewMetaHumanCharacter/BP_NewMetaHumanCharacter"
face_style = "fierce"

[qc]
min_track_coverage = 0.95
max_contact_depth_speed = 10.0   # 清理后着地脚深度方向速度中位数 cm/s
max_reproj_cm = 6.0              # 脚踝重投影误差中位数
max_penetration_pct = 5.0
max_torso_err = 8.0              # 重定向后躯干前倾误差均值（度）
max_head_err = 8.0
max_arm_err = 5.0
min_hand_detect = 0.6            # 手型识别率低于这个只警告（识别不到的帧按动作兜底）
